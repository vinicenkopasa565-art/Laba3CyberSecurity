<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додавання запису</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #6a1b9a; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #4a148c; }
        #statusMessage { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Створити нове оголошення</h2>
    
    <form id="apiForm">
        <div class="form-group">
            <label for="titleInput">Заголовок (до 120 символів):</label>
            <input type="text" id="titleInput" required maxlength="120" placeholder="Введіть заголовок...">
        </div>
        
        <div class="form-group">
            <label for="bodyInput">Текст оголошення:</label>
            <textarea id="bodyInput" required rows="5" placeholder="Введіть текст..."></textarea>
        </div>
        
        <button type="submit">Відправити в БД</button>
    </form>

    <div id="statusMessage"></div>

    <script>
        const form = document.getElementById('apiForm');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async function(event) {

            event.preventDefault(); 

            const titleValue = document.getElementById('titleInput').value;
            const bodyValue = document.getElementById('bodyInput').value;

            statusMessage.textContent = "Відправка...";
            statusMessage.style.color = "black";

            try {
                const response = await fetch('http://localhost:8080/api/data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        Title: titleValue, 
                        Body: bodyValue 
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    statusMessage.style.color = "green";
                    statusMessage.textContent = `${result.message} (ID: ${result.id})`;
                    form.reset();
                } else {
                    statusMessage.style.color = "red";
                    statusMessage.textContent = result.error || "Помилка при збереженні.";
                }
            } catch (error) {
                statusMessage.style.color = "red";
                statusMessage.textContent = "Помилка з'єднання з сервером. Перевір порт та Docker.";
                console.error(error);
            }
        });
    </script>

</body>
</html>
